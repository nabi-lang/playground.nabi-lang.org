<!doctype html>
<!-- The Open Graph card, static/og.png. Regenerate with nabi-lang.org's
     renderer: node ../nabi-lang.org/og/render.ts scripts/og.html static/og.png -->
<html class="nb dk" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../web/css/nabi.css">
<style>
  @font-face { font-family: "Geist Mono"; src: url("../web/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 72px 80px; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  .top { display: flex; align-items: center; gap: 28px; font-size: 76px; color: var(--ink-2); letter-spacing: -0.03em; } .top i { font-style: normal; color: var(--line-2); } .wm { height: 170px; width: auto; margin-left: -20px; }
  .ft { display: flex; align-items: center; gap: 18px; font-size: 30px; line-height: 40px; color: var(--ink-3); border-top: 2px solid var(--line-2); padding-top: 32px; }
  .ft b { color: var(--acc); font-weight: 500; }
  .ft span { color: var(--ink); }
  .ft i { margin-left: auto; font-style: normal; }
</style>
</head>
<body>
<div class="og">
  <div class="top"><img class="wm" src="../web/assets/brand/wordmark-dark.svg" alt=""><i>/</i>playground</div>
  <div class="ft"><b>$</b><span>Write Nabi in the browser and run it</span><i>wasm32</i></div>
</div>
</body>
</html>
